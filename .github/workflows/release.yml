name: Release

# 分工（2026-08-07 定稿）：
# - x86_64 Linux 完整体验包（嵌 CF key）由 ./release.sh 本地构建上传——CI 未配 key Secret
# - macOS 包由本 workflow 在 tag 推送时构建（macos runner + Qt clang_64 universal）
# - aarch64 Linux 无预编译包（Qt 官方无 6.11 Linux ARM64 安装包），用户走源码编译
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt 6 macOS 官方包是 universal2（x86_64+arm64），一个产物两种 Mac 通用
          - runner: macos-latest
            qt_arch: clang_64
            pkg_os: macos-universal
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Prepare embedded CF key (optional)
        # 仓库 Secret 配了 LPCL_CURSEFORGE_API_KEY 时嵌入（macOS 包也走官方 API）；
        # 未配置则产物无 key 走 MCIM 镜像。fork PR 读不到 secrets。
        env:
          CF_KEY: ${{ secrets.LPCL_CURSEFORGE_API_KEY }}
        run: |
          echo "EMBED_CF=OFF" >> "$GITHUB_ENV"
          if [ -n "$CF_KEY" ]; then
            echo "LPCL_CURSEFORGE_API_KEY=$CF_KEY" > .env
            echo "EMBED_CF=ON" >> "$GITHUB_ENV"
          fi

      - name: Build zero-dependency package (universal)
        # Qt 是 universal2，编译也出 x86_64+arm64 双架构二进制。
        # Qt 根目录以 qmake6 查询为准（install-qt-action 的 Qt6_DIR 在部分 runner 上为空）
        env:
          CMAKE_OSX_ARCHITECTURES: 'x86_64;arm64'
        run: |
          QT_ROOT="$(qmake6 -query QT_INSTALL_PREFIX 2>/dev/null || true)"
          if [ -z "$QT_ROOT" ]; then QT_ROOT="$(cd "$Qt6_DIR/../../.." && pwd)"; fi
          echo "Qt root: $QT_ROOT"
          make package-tar QT_PREFIX="$QT_ROOT" LPCL_EMBED_CF_KEY="${{ env.EMBED_CF }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpcl-${{ matrix.pkg_os }}
          path: cli/dist/lpcl-macos-*.tar.xz
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Attach macOS package to Release
        # release.sh 已建好 Release（含 x86_64 嵌 key 包 + install.sh），此处追加 macOS 包
        uses: softprops/action-gh-release@v2
        with:
          files: '**/lpcl-macos-*.tar.xz'
