name: Release

# tag 推送（v*）触发构建并自动创建 GitHub Release；也可手动触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 不在 CI 构建：嵌 CF key 的完整体验包由 release.sh 本地构建上传
          # （CI 无 key Secret，本地 .env 有）。若将来给仓库配上 LPCL_CURSEFORGE_API_KEY
          # Secret，可加回 x86_64 条目（runner: ubuntu-latest, qt_arch: gcc_64, pkg_arch: x86_64）
          - runner: ubuntu-24.04-arm # GitHub 官方 ARM runner（公开仓库免费）
            qt_arch: gcc_arm64       # aqt 的 aarch64 Qt（需 Qt >= 6.7；若该版本无此 arch，改用发行版源 Qt）
            pkg_arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libgl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Prepare embedded CF key (optional)
        # 仓库 Settings → Secrets 配了 LPCL_CURSEFORGE_API_KEY 时嵌入发布产物
        # （用户开箱即走官方 API）；未配置则产物无 key，自动走 MCIM 镜像。
        # fork PR 读不到 secrets，天然不会泄露到 PR 构建。
        env:
          CF_KEY: ${{ secrets.LPCL_CURSEFORGE_API_KEY }}
        run: |
          echo "EMBED_CF=OFF" >> "$GITHUB_ENV"
          if [ -n "$CF_KEY" ]; then
            echo "LPCL_CURSEFORGE_API_KEY=$CF_KEY" > .env
            echo "EMBED_CF=ON" >> "$GITHUB_ENV"
          fi

      - name: Build zero-dependency package
        # .env 由上一步按需生成（无 Secret 则不存在）；LPCL_EMBED_CF_KEY 控制是否嵌入
        run: make package-tar QT_PREFIX="$Qt6_DIR/../../.." LPCL_EMBED_CF_KEY="${{ env.EMBED_CF }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpcl-linux-${{ matrix.pkg_arch }}
          path: cli/dist/lpcl-linux-*.tar.gz
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # install.sh 一并发布：curl -fsSL .../releases/latest/download/install.sh | bash
          files: |
            **/lpcl-linux-*.tar.gz
            cli/install.sh
          generate_release_notes: true
