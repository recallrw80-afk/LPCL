name: Release

# ⚠️ 当前状态（2026-08-07）：本 workflow 仅手动触发备用，发版请用 ./release.sh。
#
# 原因：
# - x86_64 完整体验包（嵌 CF key）由 release.sh 本地构建上传——CI 未配 LPCL_CURSEFORGE_API_KEY Secret
# - aarch64 无法构建：Qt 官方在线仓库没有 6.11.x 的 Linux ARM64 桌面安装包
#   （aqt linux_arm64/desktop/qt6_6111 404，install-qt-action 报 "qt_base not found"）；
#   发行版源 Qt 最高 6.4，低于工程要求的 6.11。aarch64 用户请走源码编译（make install）
#
# 恢复 CI 自动发版的条件：
#   1. 仓库 Secret 配 LPCL_CURSEFORGE_API_KEY（x86_64 即可由 CI 出完整包）
#   2. Qt 官方发布 Linux ARM64 桌面包（届时恢复 ubuntu-24.04-arm + gcc_arm64 条目）
#   3. 或自托管带 Qt 6.11+ 的 ARM runner
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            qt_arch: gcc_64
            pkg_arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libgl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Prepare embedded CF key (optional)
        # 仓库 Settings → Secrets 配了 LPCL_CURSEFORGE_API_KEY 时嵌入发布产物
        # （用户开箱即走官方 API）；未配置则产物无 key，自动走 MCIM 镜像。
        # fork PR 读不到 secrets，天然不会泄露到 PR 构建。
        env:
          CF_KEY: ${{ secrets.LPCL_CURSEFORGE_API_KEY }}
        run: |
          echo "EMBED_CF=OFF" >> "$GITHUB_ENV"
          if [ -n "$CF_KEY" ]; then
            echo "LPCL_CURSEFORGE_API_KEY=$CF_KEY" > .env
            echo "EMBED_CF=ON" >> "$GITHUB_ENV"
          fi

      - name: Build zero-dependency package
        # .env 由上一步按需生成（无 Secret 则不存在）；LPCL_EMBED_CF_KEY 控制是否嵌入
        run: make package-tar QT_PREFIX="$Qt6_DIR/../../.." LPCL_EMBED_CF_KEY="${{ env.EMBED_CF }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpcl-linux-${{ matrix.pkg_arch }}
          path: cli/dist/lpcl-linux-*.tar.gz
          retention-days: 14
